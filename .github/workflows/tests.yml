name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 tests/run_ci.py
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package tracked source and checksums
        run: |
          git archive --format=zip --prefix=orchestra/ HEAD > orchestra.zip
          git archive --format=tar.gz --prefix=orchestra/ HEAD > orchestra.tar.gz
          sha256sum orchestra.zip orchestra.tar.gz > SHA256SUMS
      - name: Publish pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" orchestra.zip orchestra.tar.gz SHA256SUMS --verify-tag --prerelease --title "Orchestra $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
